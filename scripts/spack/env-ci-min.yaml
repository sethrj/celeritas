spack:
  include:
    - reqs-celer.yaml
    - reqs-ci.yaml
    - prefs-hep-nogui.yaml
    - ext-ubuntu24.yaml

  specs:
    # Build packages
    - cmake
    - ninja
    - ccache
    # Test/app packages
    - cli11
    - googletest
    - nlohmann-json
