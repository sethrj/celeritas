#-----------------------------------------------------------------------------#
# Minimal spack environment for building ROCm.
#-----------------------------------------------------------------------------#

spack:
  include:
    - reqs-celer.yaml
    - reqs-ci.yaml
    - prefs-hep-nogui.yaml
    - ext-ubuntu24.yaml

  specs:
    # Build packages
    - cmake
    - ninja
    - ccache
    # Test/app packages
    - cli11
    - googletest
    - nlohmann-json
    # HIP/ROCm requirements
    - hip # Will be duplicated by `spack add` but with version
    - hiprand +rocm
    - hipcub +rocm
    - rocthrust
    - roctracer-dev # Optional but useful
