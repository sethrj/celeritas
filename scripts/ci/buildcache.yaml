#-----------------------------------------------------------------------------#
# This file is copied into the top-level directory of Celeritas and used to
# create a buildcache.
#-----------------------------------------------------------------------------#
spack:
  include:
    - scripts/ci/ubuntu24-externals.yaml
    - scripts/spack/ci-config.yaml
    - scripts/spack/hep-variants.yaml
    - scripts/spack/celer-requirements.yaml

  concretizer:
    unify: false

  mirrors:
    github:
      url: oci://ghcr.io/sethrj/spack-buildcache
      binary: true
      signed: false
      autopush: false
      access_pair:
        id_variable: GITHUB_USER
        secret_variable: GITHUB_TOKEN

  definitions:
    - compilers:
        - ubuntu_clang # see toolchains

    - packages:
        - ccache
        - cmake
        - ninja
        - git
        - python
        - py-gcovr

        - cli11
        - nlohmann-json
        - geant4
        - googletest
        - covfie
        - g4vg
        - hepmc3
        - vecgeom
        - "vecgeom@2.0.0-rc.7"
        - root

        # Specific versions
        - "vecgeom@1.2"
        - "geant4@10.5"
        - "geant4@10.6"
        - "geant4@10.7"
        - "geant4@11.0"
        - "geant4@11.1"
        - "geant4@11.2"
        - "geant4@11.3"
        - "geant4@11.4"

  specs:
    - matrix:
        - [$%compilers]
        - [$packages]
