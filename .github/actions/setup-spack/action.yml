#-----------------------------------------------------------------------------#
# Bootstrap a Spack environment, build/install dependencies, activate it, and
# configure Celeritas against it.
#
# NOTE: sync spack versions with https://github.com/celeritas-project/spack-gha-buildcache
# - Spack version
# - Any required spack patches
# - Github runner versions
# - Environment versions at scripts/ci/spack.yaml
#-----------------------------------------------------------------------------#

name: "Set up Spack environment"
description: "Check out Celeritas + Spack, concretize/install deps, activate, and configure"
inputs:
  cxxstd:
    description: "C++ standard to concretize Spack with"
    required: true
  add:
    description: "Space-separated list of additional spack packages to add"
    required: false
    default: ""
  # TODO: add-gcovr option for codecov

runs:
  using: "composite"
  steps:
    - name: Set environment variables
      shell: bash
      run: |
        SPACK_ROOT="$(realpath GITHUB_WORKSPACE/spack-src)"
        echo "$SPACK_ROOT/bin" >> "$GITHUB_PATH"
        {
          echo "CELER_SPACK_VIEW=/opt/view"
          echo "SPACK_ROOT=$SPACK_ROOT"
          echo "SPACK_BUILDCACHE=celer-buildcache"
          echo "SPACK_COLOR=always"
          echo "SPACK_DISABLE_LOCAL_CONFIG=1"
        } >> "$GITHUB_ENV"
    - name: Checkout Spack
      uses: actions/checkout@v7
      with:
        repository: celeritas-project/spack
        path: ${{env.SPACK_ROOT}}
        ref: 760ccc43172ac3bf0d9a07b156f7b1f44c743677 # ci @ 11 Oct 2025

    # TODO when upgrading: checkout spack packages
    - name: Initialize spack environment
      shell: bash
      run: |
        echo "Spack architecture is $(spack arch)"
        sed -e 's/cxxstd=default/cxxstd=${{inputs.cxxstd}}/' \
          scripts/ci/spack.yaml > spack.yaml

        spack -e . config add "view:${CELER_SPACK_VIEW}"
        if [ -n "${{inputs.add}}" ]; then
          spack -e . add ${{inputs.add}}
        fi
        echo "::group::Find compilers"
        spack -vd -e . compiler find clang # FIXME
        echo "::endgroup::"
        # Add the spack ref so that updating spack will reconcretize
        SPACK_REF=$(git -C "${{env.SPACK_ROOT}}" log -1 --pretty=%H HEAD)
        echo "# Concretized with ${SPACK_REF}" >> spack.yaml

    - name: Restore cached lockfile
      uses: actions/cache/restore@v5
      with:
        path: spack.lock
        key: lock-${{hashFiles('spack.yaml')}}-${{github.run_id}}
        restore-keys: lock-${{hashFiles('spack.yaml')}}
    - name: Concretize
      id: concretize
      shell: bash
      run: |
        if ! spack -e . -v concretize ; then
          ERR=$?
          cat spack.yaml
          exit $ERR
        fi
    - name: Cache lockfile
      if: ${{ always() && steps.build.outcome == 'success' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: lock-${{hashFiles('spack.yaml')}}-${{github.run_id}}

    - name: Install dependencies
      id: installdeps
      shell: bash
      run: |
        spack -e . env depfile -o Makefile
        make -Orecurse -j $(($(nproc) + 1)) SPACK_INSTALL_FLAGS=--no-check-signature
    - name: Save Spack installation to build cache
      shell: bash
      env:
        GITHUB_ACTOR: ${{github.actor}}
        GITHUB_TOKEN: ${{github.token}}
      # TODO: avoid pushing in the future so that we don't overwrite the spack prefix stuff
      run: |
        spack -e . mirror set --push --oci-username-variable GITHUB_ACTOR --oci-password-variable GITHUB_TOKEN ${SPACK_BUILDCACHE}
        spack -e . buildcache push -j $(($(nproc) + 1)) --base-image ubuntu:22.04 --unsigned --update-index ${SPACK_BUILDCACHE}
      if: ${{github.event_name == 'push' && !cancelled()}}
    # NOTE: set downstream shells to `${CELER_SPACK_VIEW}/sh {0}`
    - name: Create shell with Celeritas environment
      shell: sh
      run: |
        SHELL_WRAPPER="${SPACK_ROOT}/bin/celer-env-sh"
        cat > "${SHELL_WRAPPER}" <<EOF
        #!/bin/sh -e
        $(spack env activate --sh .)
        . "\$1"
        EOF
        chmod +x "${SHELL_WRAPPER}"
        echo "::group::Dump shell wrapper at ${SHELL_WRAPPER}"
        cat "${SHELL_WRAPPER}"
        echo "::endgroup::"
