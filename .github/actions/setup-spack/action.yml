#-----------------------------------------------------------------------------#
# Bootstrap a Spack environment, build/install dependencies, activate it, and
# configure Celeritas against it.
#
# NOTE: sync spack versions with https://github.com/celeritas-project/spack-gha-buildcache
# - Spack version
# - Any required spack patches
# - Github runner versions
# - Environment versions at scripts/ci/spack.yaml
#-----------------------------------------------------------------------------#

name: "Set up Spack environment"
description: "Check out Celeritas + Spack, concretize/install deps, activate, and configure"
inputs:
  cxxstd:
    description: "C++ standard to concretize Spack with"
    required: true
  add:
    description: "Space-separated list of additional spack packages to add"
    required: false
    default: ""
  # TODO: add-gcovr option for codecov

runs:
  using: "composite"
  steps:
    - name: Set environment variables
      shell: sh
      run: |
        SPACK_ROOT="$GITHUB_WORKSPACE/spack-src"
        echo "$SPACK_ROOT/bin" >> "$GITHUB_PATH"
        {
          echo "CELER_SPACK_VIEW=/opt/view"
          echo "CELER_BASE_IMAGE=ubuntu:24.04"
          echo "CELER_BUILDCACHE=sethrj"
          echo "SPACK_PACKAGES=$GITHUB_WORKSPACE/spack-pkg"
          echo "SPACK_ROOT=$SPACK_ROOT"
          echo "SPACK_COLOR=always"
          echo "SPACK_DISABLE_LOCAL_CONFIG=1"
        } >> "$GITHUB_ENV"
    - name: Checkout Spack
      uses: actions/checkout@v7
      with:
        repository: spack/spack
        path: ${{env.SPACK_ROOT}}
        ref: 57f9c9504e7f2f30462d68e9c5f67a64ba8c87c8

    - name: Checkout Spack packages
      uses: actions/checkout@v7
      with:
        repository: celeritas-project/spack-packages
        path: ${{env.SPACK_PACKAGES}}
        ref: 2c1c9409a3828d9d3a3985fd0ae200bd8bd82117

    - name: Initialize spack environment
      shell: sh
      run: |
        ./scripts/ci/setup-spack-ci-env.sh ${{inputs.add}}

    - name: Dump spack config
      if: ${{runner.debug}}
      shell: sh
      run: |
        spack -e . config blame

    - name: Restore cached lockfile
      uses: actions/cache/restore@v5
      with:
        path: spack.lock
        key: lock-${{hashFiles('spack.yaml')}}-${{github.run_id}}
        restore-keys: lock-${{hashFiles('spack.yaml')}}
    - name: Concretize
      id: concretize
      shell: sh
      run: |
        spack -e . -v concretize || {
          ERR=$?
          cat spack.yaml
          exit $ERR
        }
    - name: Cache lockfile
      if: ${{ always() && steps.build.outcome == 'success' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: lock-${{hashFiles('spack.yaml')}}-${{github.run_id}}

    - name: Install dependencies
      shell: sh
      run: |
        spack -e . install
    - name: Push Spack installation to buildcache
      if: ${{github.event_name == 'push' && !cancelled()}}
      shell: sh
      env:
        GITHUB_USER: ${{github.actor}}
        GITHUB_TOKEN: ${{github.token}}
      run: |
        spack -e . buildcache push \
          --base-image $CELER_BASE_IMAGE --update-index \
          $CELER_BUILDCACHE

    - name: Update environment and create rc file
      shell: sh
      run: |
        echo "$CELER_SPACK_VIEW/bin" >> "$GITHUB_PATH"
        spack env activate --sh . > "${CELER_SPACK_VIEW}/rc"
        grep '^export ' "${CELER_SPACK_VIEW}/rc" \
          | grep -v '^export PATH=' \
          | sed 's/^export //' >> "$GITHUB_ENV"
        echo "::group::Dump ${CELER_SPACK_VIEW}/rc"
        cat "${CELER_SPACK_VIEW}/rc"
        echo "::endgroup::"
