#-----------------------------------------------------------------------------#
# Restore a ccache directory, build, and save the cache on success.
#-----------------------------------------------------------------------------#

name: "Build with ccache"
description: "Restore ccache, build a preset, show statistics, and save on success"
inputs:
  preset:
    description: "CMake build preset to execute"
    required: true
  name:
    description: "Cache key component, without the github.run_id suffix or ccache prefix"
    required: true
  ccache-dir:
    description: "Directory to use for ccache"
    required: false
    default: "${{github.workspace}}/.ccache"
  ccache-max-size:
    description: "Maximum size of the ccache directory"
    required: true
  ccache-debug:
    description: "Run ccache with this debug level (zero for NODEBUG)"
    required: false
    default: "0"
  ccache-debug-dir:
    description: "Save ccache debug logs to this directory when ccache-debug"
    required: false
    default: "${{github.workspace}}/build/ccache-debug"
outputs:
  build-outcome:
    description: "Outcome of the build step ('success' or 'failure')"
    value: ${{steps.build.outcome}}

runs:
  using: "composite"
  steps:
    - name: Restore ccache
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.ccache-dir }}
        key: ccache-${{ inputs.name }}-${{ github.run_id }}
        restore-keys: ccache-${{ inputs.name }}

    - name: Configure ccache environment
      shell: bash
      run: |
        {
          echo "CCACHE_DIR=${{ inputs.ccache-dir }}"
          echo "CCACHE_MAXSIZE=${{ inputs.ccache-max-size }}"
          echo "CCACHE_DEBUG=${{ fromJSON(inputs.ccache-debug) > 0 && '1' || '' }}"
          echo "CCACHE_DEBUGLEVEL=${{ inputs.ccache-debug }}"
          echo "CCACHE_DEBUGDIR=${{ inputs.ccache-debug-dir }}"
        } >> "$GITHUB_ENV"

    - name: Zero ccache stats
      shell: bash
      run: ccache -z

    - name: Build
      id: build
      shell: bash
      run: cmake --build --preset=${{ inputs.preset }} --verbose

    - name: Show ccache stats
      if: ${{ !cancelled() }}
      shell: bash
      run: ccache -s

    - name: Save ccache
      if: ${{ always() && steps.build.outcome == 'success' }}
      uses: actions/cache/save@v5
      with:
        enableCrossOsArchive: true # fix windows upload sizes
        upload-chunk-size: 67108864 # 64MB
        path: ${{ inputs.ccache-dir }}
        key: ccache-${{ inputs.name }}-${{ github.run_id }}

    - name: Upload ccache debug
      if: ${{ fromJSON(inputs.ccache-debug) > 0 && !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        path: ${{ inputs.ccache-debug-dir }}
        name: debug-ccache-${{ inputs.name }}-${{ github.run_id }}
        overwrite: false
        if-no-files-found: error
        retention-days: 7
