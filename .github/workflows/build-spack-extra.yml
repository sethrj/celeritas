name: build-spack-extra
on:
  workflow_dispatch: {}
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true

concurrency:
  group: build-spack-extra-${{github.event.number || github.ref_name}}
  cancel-in-progress: true

env:
  CC: "clang-18"
  CXX: "clang++-18"
  CXXSTD: 20

jobs:
  asan:
    name: reldeb-orange-asanlite
    env:
      CELER_CMAKE_PRESET: reldeb-orange-asanlite
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Celeritas
        uses: actions/checkout@v7
        with:
          fetch-tags: true # to get version information
      - name: Set up Spack environment
        uses: ./.github/actions/setup-spack
        with:
          cxxstd: ${{env.CXXSTD}}
      - name: Configure Celeritas
        id: configure
        uses: ./.github/actions/configure
        with:
          preset: ${{env.CELER_CMAKE_PRESET}}
          presets-file: "ci-ubuntu-github.json"
      - name: Build all
        id: build
        uses: ./.github/actions/build-cached
        with:
          name: spack-${{env.CELER_CMAKE_PRESET}}
          preset: spack
          ccache-max-size: 512Mi
      - name: Run tests
        id: test
        uses: ./.github/actions/run-ctest
        with:
          name: spack-${{env.CELER_CMAKE_PRESET}}
          preset: spack
          split-app: true
          strict: false

  tidy:
    name: tidy-vecgeom
    env:
      CELER_CMAKE_PRESET: reldeb-vecgeom-tidy
      CLANG_TIDY: "clang-tidy-18"
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Celeritas
        uses: actions/checkout@v7
        with:
          fetch-tags: true # to get version information
      - name: Set up Spack environment
        uses: ./.github/actions/setup-spack
        with:
          add: "geant4@11.2 vecgeom@1.2.11:1 g4vg"
          cxxstd: ${{env.CXXSTD}}
      - name: Configure Celeritas
        uses: ./.github/actions/configure
        with:
          preset: ${{env.CELER_CMAKE_PRESET}}
          presets-file: "ci-ubuntu-github.json"
      - name: Build changed files with clang-tidy
        if: ${{github.workflow == 'pull_request'}}
        run: |
          "${{github.workspace}}/scripts/ci/clang-tidy-changed.sh" origin/"${{ github.base_ref }}"
      # NOTE: this is not yet used but can be manually invoked
      - name: Build all files with clang-tidy
        if: ${{github.workflow != 'pull_request'}}
        run: cmake --build --preset=spack

  codecov:
    name: codecov-vecgeom
    env:
      CELER_CMAKE_PRESET: ndebug-vecgeom-codecov
      LLVM_COV: "llvm-cov-18"
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Celeritas
        uses: actions/checkout@v7
        with:
          fetch-tags: true # to get version information
      - name: Set up Spack environment
        uses: ./.github/actions/setup-spack
        with:
          add: vecgeom@1.2.11 geant4@11.3 g4vg root py-gcovr
          cxxstd: ${{env.CXXSTD}}
      - name: Configure Celeritas
        uses: ./.github/actions/configure
        with:
          preset: ${{env.CELER_CMAKE_PRESET}}
          presets-file: "ci-ubuntu-github.json"
      - name: Build all
        id: build
        uses: ./.github/actions/build-cached
        with:
          name: spack-${{env.CELER_CMAKE_PRESET}}
          preset: spack
          ccache-max-size: 512Mi
      - name: Run tests
        id: test
        uses: ./.github/actions/run-ctest
        with:
          name: spack-${{env.CELER_CMAKE_PRESET}}
          preset: spack-codecov
          split-app: true
      - name: Generate and upload coverage report
        if: ${{ !cancelled() && steps.build.outputs.build-outcome == 'success' }}
        uses: ./.github/actions/process-coverage
        with:
          name: spack-${{env.CELER_CMAKE_PRESET}}
          token: ${{secrets.CODECOV_TOKEN}}
          gcov-exe: "${{github.workspace}}/scripts/ci/llvm-gcov.sh"

