#-----------------------------------------------------------------------------#
# Run a series of progressively expensive checks on each pull request
#-----------------------------------------------------------------------------#

name: pull_request
run-name: >-
  ${{github.event.pull_request.title}}
  (#${{github.event.number}})

on:
  pull_request:
    branches:
      - develop
      - backports/**
    paths-ignore:
      - "**.rst"
      - "**.md"
      - "scripts"
      - ".jenkins"
      - "!scripts/cmake-presets/ci*"
      - "!scripts/ci"
      - "!scripts/build.sh"

concurrency:
  group: pr-${{github.ref}}-${{github.event.number}}-${{github.workflow}}
  cancel-in-progress: false

jobs:
  diagnostics:
    name: "Print diagnostics"
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{toJSON(github)}}"
  metadata:
    name: "Save job metadata"
    runs-on: ubuntu-24.04
    steps:
      # Event file is needed for pull_request_completed.report-tests
      - name: Upload event file
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: event-file
          path: ${{github.event_path}}
  build-fast:
    uses: ./.github/workflows/build-fast.yml
  build-ultralite:
    uses: ./.github/workflows/build-ultralite.yml
  doc:
    uses: ./.github/workflows/doc.yml
  all-prechecks:
    needs: [build-fast, build-ultralite, doc]
    runs-on: ubuntu-24.04
    steps:
      - name: Success
        run: "true"
  build-spack:
    needs: [all-prechecks]
    uses: ./.github/workflows/build-spack.yml

  # Since docker builds aren't cached and are large, don't run on draft
  # Also avoid coverage checks until ready (those are also expensive)
  build-docker:
    if: ${{github.event.pull_request.draft == false}}
    needs: [all-prechecks]
    uses: ./.github/workflows/build-docker.yml
  build-spack-asan:
    if: ${{github.event.pull_request.draft == false}}
    needs: [all-prechecks]
    uses: ./.github/workflows/build-spack-asan.yml
  build-spack-tidy:
    if: ${{github.event.pull_request.draft == false}}
    needs: [all-prechecks]
    uses: ./.github/workflows/build-spack-tidy.yml
  build-spack-codecov:
    if: ${{github.event.pull_request.draft == false}}
    needs: [all-prechecks]
    uses: ./.github/workflows/build-spack-codecov.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  build-docker-codecov:
    if: ${{github.event.pull_request.draft == false}}
    needs: [all-prechecks]
    uses: ./.github/workflows/build-docker-codecov.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Specifying a dependent job allows us to select a single "requires" check in the project GitHub settings
  all:
    if: ${{always()}}
    needs:
      - build-spack
      - build-docker
      - build-spack-asan
      - build-spack-tidy
      - build-spack-codecov
      - build-docker-codecov
    runs-on: ubuntu-24.04
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@v1.3.0 # immutable
        with:
          jobs: ${{toJSON(needs)}}

