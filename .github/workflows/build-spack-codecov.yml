#-----------------------------------------------------------------------------#
# Build with coverage instrumentation using Spack and upload results to Codecov.
#-----------------------------------------------------------------------------#

name: build-spack-codecov
on:
  workflow_dispatch: {}
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true

concurrency:
  group: build-spack-codecov-${{github.event.number || github.ref_name}}
  cancel-in-progress: true

jobs:
  spack:
    name: codecov-vecgeom
    env:
      CELER_CMAKE_PRESET: ndebug-vecgeom-codecov
      CC: "clang-18"
      CXX: "clang++-18"
      LLVM_COV: "llvm-cov-18"
      CXXSTD: 20
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Celeritas
        uses: actions/checkout@v7
        with:
          fetch-tags: true # to get version information

      - name: Set up Spack environment
        uses: ./.github/actions/setup-spack
        with:
          preset: ${{env.CELER_CMAKE_PRESET}}
          add: vecgeom@1.2.11 geant4@11.4 g4vg root py-gcovr
          cxxstd: ${{env.CXXSTD}}

      - name: Configure Celeritas
        uses: ./.github/actions/configure
        with:
          preset: ${{env.CELER_CMAKE_PRESET}}
          presets-file: "ci-ubuntu-github.json"

      - name: Build all
        id: build
        uses: ./.github/actions/ccache-build
        with:
          name: spack-${{env.CELER_CMAKE_PRESET}}
          preset: spack
          ccache-max-size: 512Mi

      - name: Regenerate ROOT test data
        working-directory: build
        run: |
          ninja -v -k0 update-root-test-data

      - name: Run tests
        id: test
        uses: ./.github/actions/run-ctest
        with:
          name: spack-${{env.CELER_CMAKE_PRESET}}
          preset: spack-codecov
          split-app: true

      - name: Generate and upload coverage report
        uses: ./.github/actions/generate-coverage
        with:
          name: spack-${{env.CELER_CMAKE_PRESET}}
          token: ${{secrets.CODECOV_TOKEN}}
          gcov-exe: "${{github.workspace}}/scripts/ci/llvm-gcov.sh"

