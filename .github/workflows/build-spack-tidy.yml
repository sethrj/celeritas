#-----------------------------------------------------------------------------#
# Run clang-tidy on changed files (or, on a schedule, the whole build) using Spack.
#-----------------------------------------------------------------------------#

name: build-spack-tidy
on:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: build-spack-tidy-${{github.event.number || github.ref_name}}
  cancel-in-progress: true

jobs:
  tidy:
    name: tidy-vecgeom
    env:
      CELER_CMAKE_PRESET: reldeb-vecgeom-tidy
      CLANG_TIDY: "clang-tidy-18"
      CC: "clang-18"
      CXX: "clang++-18"
      CXXSTD: 20
    runs-on: ubuntu-24.04
    continue-on-error: false
    steps:
      - name: Check out Celeritas
        uses: actions/checkout@v7
        with:
          fetch-depth: 383
          fetch-tags: true # to get version information

      - name: Set up Spack environment
        uses: ./.github/actions/setup-spack
        with:
          add: "geant@11.2 vecgeom@1.2.11:1"
          cxxstd: ${{env.CXXSTD}}

      - name: Configure Celeritas
        uses: ./.github/actions/configure
        with:
          preset: ${{env.CELER_CMAKE_PRESET}}
          presets-file: "ci-ubuntu-github.json"

      - name: Build changed files with clang-tidy
        if: ${{github.workflow == 'pull_request'}}
        run: |
          ./scripts/ci/clang-tidy-changed.sh origin/"${{ github.base_ref }}"

      # NOTE: this is not yet used but can be manually invoked
      - name: Build all files with clang-tidy
        if: ${{github.workflow != 'pull_request'}}
        run: cmake --build --preset=spack

