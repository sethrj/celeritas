name: build-spack-asan
on:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: build-spack-asan-${{github.event.number || github.ref_name}}
  cancel-in-progress: true

jobs:
  spack:
    name: reldeb-orange-asanlite
    env:
      CELER_CMAKE_PRESET: reldeb-orange-asanlite
      CC: "clang-18"
      CXX: "clang++-18"
      CXXSTD: 20
    runs-on: ubuntu-24.04
    continue-on-error: false
    steps:
      - name: Check out Celeritas
        uses: actions/checkout@v7
        with:
          fetch-depth: 383
          fetch-tags: true # to get version information

      - name: Set up Spack environment
        uses: ./.github/actions/spack-setup
        with:
          cxxstd: ${{env.CXXSTD}}

      - name: Configure Celeritas
        id: configure
        uses: ./.github/actions/configure
        with:
          preset: ${{env.CELER_CMAKE_PRESET}}
          presets-file: "ci-ubuntu-github.json"

      - name: Build all
        id: build
        uses: ./.github/actions/ccache-build
        with:
          name: spack-${{env.CELER_CMAKE_PRESET}}
          preset: spack
          ccache-max-size: 512Mi

      - name: Run tests
        id: test
        uses: ./.github/actions/run-ctest
        with:
          name: spack-${{env.CELER_CMAKE_PRESET}}
          preset: spack
          split-app: true
          strict: false

